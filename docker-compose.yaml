services:
  mikhmon_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mikhmon-v4:latest
    container_name: mikhmon_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./config:/var/www/html/config
    environment:
      - TZ=${TIMEZONE:-Asia/Jakarta}
    networks:
      mikhmon_network:
        ipv4_address: 172.28.0.5

  mikhmon_web:
    image: nginx:alpine
    container_name: mikhmon_web
    restart: unless-stopped
    depends_on:
      - mikhmon_app
    volumes:
      - .:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PORT:-8080}:80"
    environment:
      - TZ=${TIMEZONE:-Asia/Jakarta}
    networks:
      mikhmon_network:
        ipv4_address: 172.28.0.6

networks:
  mikhmon_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
